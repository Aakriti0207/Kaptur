<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e9"/>
      <stop offset="1" stop-color="#eadcc3"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4632"/>
      <stop offset="1" stop-color="#3b251b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e79a43"/>
      <stop offset="1" stop-color="#b96520"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.7" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- cream app tile -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bg)"/>

  <!-- briefcase handle -->
  <path d="M25 25v-5.2c0-2.1 1.7-3.8 3.8-3.8h6.4c2.1 0 3.8 1.7 3.8 3.8V25"
        fill="none" stroke="url(#gold)" stroke-width="3.8" stroke-linecap="round"/>

  <!-- briefcase -->
  <rect x="12" y="22" width="40" height="25" rx="5.5" fill="url(#bag)" filter="url(#shadow)"/>
  <path d="M12 31.5h40" stroke="#2d1c15" stroke-width="1.4" opacity=".7"/>

  <!-- envelope -->
  <path d="M8.5 35.5 32 50.5l23.5-15v15.8c0 3-2.4 5.4-5.4 5.4H13.9c-3 0-5.4-2.4-5.4-5.4z"
        fill="#fff8e9"/>
  <path d="M8.8 35.7 28.7 48.3c2 1.3 3.6 1.3 5.6 0l19.9-12.6"
        fill="none" stroke="#eadcc3" stroke-width="1.2"/>

  <!-- clasp -->
  <circle cx="32" cy="48.5" r="4.3" fill="url(#gold)" filter="url(#shadow)"/>

  <!-- sparkle -->
  <path d="M45.2 25.8l1.1 2.8 2.8 1.1-2.8 1.1-1.1 2.8-1.1-2.8-2.8-1.1 2.8-1.1z"
        fill="#e89a3e"/>
  <path d="M50.3 29.2l.65 1.55 1.55.65-1.55.65-.65 1.55-.65-1.55-1.55-.65 1.55-.65z"
        fill="#fff8e9"/>
</svg>